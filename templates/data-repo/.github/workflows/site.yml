name: Site
on:
  push:
    branches: [main]
    paths: ["drafts/**", "published/**", "config.json", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { path: data }
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.TRIPBOOK_REPO }}
          ref: ${{ vars.TRIPBOOK_REF }}
          path: tripbook
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tripbook/package-lock.json
      - run: npm ci --omit=dev
        working-directory: tripbook
      - run: node src/build/build-site.mjs --data ../data --out ../_site
        working-directory: tripbook
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
